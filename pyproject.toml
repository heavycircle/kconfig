[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kconfig"
version = "0.1.0"
description = "Reverse kernel .config files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.25.2", "tree-sitter-c>=0.24.2"]

[project.scripts]
kconfig = "kconfig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kconfig"]
